<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spécimen — Design System</title>
  <link rel="stylesheet" href="tokens/primitives.css">
  <link rel="stylesheet" href="tokens/semantic.css">
  <link rel="stylesheet" href="tokens/foundations.css">
  <link rel="stylesheet" href="components/button.css">
  <style>
    body { font-family: var(--font-family-base); line-height: var(--line-height-body);
           color: var(--color-text-default); background: var(--color-bg-default);
           margin: 0 auto; padding: var(--space-4); max-width: 60rem; }
    #swatches { list-style: none; padding: 0; display: grid; gap: var(--space-2); }
    #swatches li { display: flex; align-items: center; gap: var(--space-2); }
    #swatches span { inline-size: 2rem; block-size: 2rem; border: 1px solid; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Spécimen de tokens</h1>
  <button class="button" type="button" id="theme" aria-pressed="false">Thème sombre</button>
  <h2>Couleurs sémantiques</h2>
  <ul id="swatches"></ul>
  <script>
    // TODO étape 5 : ajoutez tous vos tokens sémantiques
    const tokens = ['--color-text-default', '--color-bg-default', '--color-action-primary'];
    const list = document.querySelector('#swatches');
    const render = () => {
      const root = getComputedStyle(document.documentElement);
      list.innerHTML = '';
      tokens.forEach((name) => {
        const li = document.createElement('li');
        li.innerHTML = `<span style="background:var(${name})"></span> <code>${name}</code> ${root.getPropertyValue(name)}`;
        list.append(li);
      });
    };
    document.querySelector('#theme').addEventListener('click', (e) => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      e.currentTarget.setAttribute('aria-pressed', dark);
      render();
    });
    render();
  </script>
</body>
</html>
